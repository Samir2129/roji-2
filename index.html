<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Rojina ❤️</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >
</head>

<body class="countdown-page">

    <!-- Loader -->
    <div id="loader">
        <h1>✨ Preparing a Surprise... ✨</h1>
    </div>

    <!-- Background -->
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <div class="moon"></div>

    <!-- Floating hearts -->
    <div id="hearts"></div>

    <!-- Countdown -->
    <main>

        <section id="countdown-section">

            <h2>Countdown to Rojina's Birthday 🎂</h2>

            <div class="countdown">

                <div class="time-box">
                    <span id="days">00</span>
                    <p>Days</p>
                </div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <p>Hours</p>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <p>Minutes</p>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <p>Seconds</p>
                </div>

            </div>

        </section>


        <!-- Hero -->
        <section class="hero">

            <h1 class="title">
                Happy 23nd Birthday
            </h1>

            <h2 class="name">
                Rojina 💖
            </h2>

            <p class="subtitle">
                29 August 2027
            </p>

            <button
                id="openGift"
                type="button"
                disabled
            >
                🎁 Surprise Unlocks on 29/08/2027
            </button>

        </section>

    </main>


    <footer>
        Made with ❤️ for Rojina
    </footer>


    <script src="script.js"></script>

</body>
</html>
